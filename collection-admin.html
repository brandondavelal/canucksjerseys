<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canucks Jerseys — Admin</title>
<script src="data.js"></script>
<script src="order.js"></script>
<script src="inventory.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black:  #000;
  --white:  #fff;
  --grey:   #767676;
  --lgrey:  #b0b0b0;
  --border: #e0e0e0;
  --bg:     #f5f5f7;
  --f: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --hdr1: 80px;
}

html, body { height: 100%; overflow-x: hidden; }
body { font-family: var(--f); background: var(--white); color: var(--black); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; }

header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--white); border-bottom: 1px solid var(--border); }
.hdr-top { height: var(--hdr1); display: flex; align-items: center; justify-content: center; padding: 0 24px; position: relative; }
.logo { height: 40px; }
.hdr-count { position: absolute; left: 24px; font-size: 13px; color: var(--grey); letter-spacing: 0.04em; }
.hdr-right { position: absolute; right: 24px; display: flex; gap: 24px; align-items: center; }
.hdr-right a, .hdr-right button { font-family: var(--f); font-size: 14px; color: var(--grey); text-decoration: none; letter-spacing: 0.04em; background: none; border: none; cursor: pointer; padding: 0; }
.hdr-right a:hover, .hdr-right button:hover { color: var(--black); }
.hdr-right button:disabled { color: var(--lgrey); cursor: default; }

.notice { padding: calc(var(--hdr1) + 28px) 48px 0; font-size: 13px; color: var(--grey); line-height: 1.5; }
.notice b { color: var(--black); font-weight: 500; }
.notice .dirty { color: #c0392b; }

main { padding: 24px 48px 100px; max-width: none; margin: 0; }

.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; }
.card { display: flex; flex-direction: column; min-width: 0; }
.card.dragging { opacity: 0.4; }
.card.drag-over { outline: 2px solid var(--black); outline-offset: 2px; }
.card-thumb-wrap { position: relative; aspect-ratio: 4/3; background: var(--bg); overflow: hidden; cursor: grab; }
.card-thumb { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.card-num { position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.55); color: #fff; font-size: 11px; letter-spacing: 0.04em; padding: 3px 7px; border-radius: 3px; pointer-events: none; }
.card-move { position: absolute; top: 4px; left: 4px; right: 4px; display: flex; flex-direction: row; justify-content: space-between; }
.card-move button { width: 24px; height: 20px; font-size: 12px; color: var(--black); background: rgba(255,255,255,0.85); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.card-move button:hover { background: #fff; }
.card-move button:disabled { color: var(--lgrey); cursor: default; }
.card-info { margin-top: 10px; }
.card-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sub { font-size: 12px; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

.empty { padding: 80px 0; text-align: center; color: var(--lgrey); font-size: 15px; }
</style>
</head>
<body>

<header>
  <div class="hdr-top">
    <span class="hdr-count" id="hdr-count"></span>
    <img class="logo" src="images/Frame 1.png" alt="Canucks Jerseys">
    <div class="hdr-right">
      <button id="btn-reset" type="button">Reset to sheet order</button>
      <a href="#" id="btn-export">Export Order ↓</a>
      <a href="index.html" target="_blank">View Site →</a>
    </div>
  </div>
</header>

<div class="notice" id="notice"></div>
<main>
  <div id="list"></div>
</main>

<script>
/* The Google Sheet (columns A-M) is the inventory. This page only decides the ORDER jerseys appear in:
   drag the cards (or use the arrows), then Export Order and replace order.js in the project. */
var S = { products: [], live: false, dirty: false };
var DRAFT_KEY = 'cj-admin-order';

function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function baseOrder() { return typeof GALLERY_ORDER !== 'undefined' ? GALLERY_ORDER : []; }
function draftOrder() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { return null; } }
function saveDraft() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(S.products.map(function(p) { return p.id; }))); } catch (e) {} }

function setProducts(list) {
  var order = draftOrder() || baseOrder();
  S.products = applyOrder(list, order);
}

document.getElementById('btn-export').addEventListener('click', function(e) {
  e.preventDefault();
  var ids = S.products.map(function(p) { return p.id; });
  var text = '/* manual order saved from collection-admin.html (ids from the sheet). Empty = sheet order. */\nvar GALLERY_ORDER = ' + JSON.stringify(ids, null, 2) + ';\n';
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/javascript' }));
  a.download = 'order.js';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  S.dirty = false; render();
});

document.getElementById('btn-reset').addEventListener('click', function() {
  try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
  S.products = S.products.slice().sort(function(a, b) { return S.sheetPos[a.id] - S.sheetPos[b.id]; });
  S.dirty = true; saveDraft(); render();
});

function notice() {
  var el = document.getElementById('notice');
  el.innerHTML = (S.live ? 'Reading the <b>live sheet</b>.' : 'Showing the <b>saved snapshot</b> (the live sheet could not be reached).') +
    ' The sheet (columns A–M) is the inventory; this page only sets the order. ' +
    (S.dirty ? '<span class="dirty">Order changed — Export Order and replace order.js to publish it.</span>' : 'Drag a card, or use the arrows, to reorder.');
}

function render() {
  var list = document.getElementById('list');
  document.getElementById('hdr-count').textContent = S.products.length + ' ' + (S.products.length === 1 ? 'Jersey' : 'Jerseys');
  notice();
  if (!S.products.length) { list.innerHTML = '<div class="empty">The sheet has no jerseys.</div>'; return; }
  var last = S.products.length - 1;
  list.innerHTML = '<div class="grid">' + S.products.map(function(p, i) {
    var sub = [p.manufacturer, p.year].filter(Boolean).join(' · ');
    return '<div class="card" data-i="' + i + '" draggable="true">' +
      '<div class="card-thumb-wrap">' +
        '<img class="card-thumb" src="' + esc((p.images || [])[0] || '') + '" alt="">' +
        '<div class="card-num">' + (i + 1) + '</div>' +
        '<div class="card-move">' +
          '<button class="card-up" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + '>‹</button>' +
          '<button class="card-down" data-i="' + i + '"' + (i === last ? ' disabled' : '') + '>›</button>' +
        '</div>' +
      '</div>' +
      '<div class="card-info">' +
        '<div class="card-title">' + esc(p.title || p.team || 'Untitled') + '</div>' +
        '<div class="card-sub">' + esc([p.team, p.player, sub].filter(Boolean).join(' — ')) + '</div>' +
      '</div>' +
    '</div>';
  }).join('') + '</div>';

  list.querySelectorAll('.card-up').forEach(function(b) { b.addEventListener('click', function() { move(+b.dataset.i, -1); }); });
  list.querySelectorAll('.card-down').forEach(function(b) { b.addEventListener('click', function() { move(+b.dataset.i, 1); }); });

  var cards = list.querySelectorAll('.card');
  cards.forEach(function(card) {
    card.addEventListener('dragstart', function(e) {
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', card.dataset.i);
    });
    card.addEventListener('dragend', function() {
      card.classList.remove('dragging');
      cards.forEach(function(c) { c.classList.remove('drag-over'); });
    });
    card.addEventListener('dragover', function(e) {
      e.preventDefault();
      if (card.classList.contains('dragging')) return;
      cards.forEach(function(c) { c.classList.remove('drag-over'); });
      card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', function() { card.classList.remove('drag-over'); });
    card.addEventListener('drop', function(e) {
      e.preventDefault();
      card.classList.remove('drag-over');
      var from = +e.dataTransfer.getData('text/plain'), to = +card.dataset.i;
      if (from === to) return;
      var item = S.products.splice(from, 1)[0];
      S.products.splice(to, 0, item);
      S.dirty = true; saveDraft(); render();
    });
  });
}

function move(i, dir) {
  var j = i + dir;
  if (j < 0 || j >= S.products.length) return;
  var item = S.products.splice(i, 1)[0];
  S.products.splice(j, 0, item);
  S.dirty = true; saveDraft(); render();
}

function start(list, live) {
  S.live = live;
  S.sheetPos = {}; list.forEach(function(p, i) { S.sheetPos[p.id] = i; });
  var before = S.products.map(function(p) { return p.id; }).join('|');
  setProducts(list); S.dirty = !!draftOrder();
  if (!S.products.length || before !== S.products.map(function(p) { return p.id; }).join('|') || live) render();
}

/* snapshot first, then the live sheet */
start(rowsToProducts(SNAPSHOT_ROWS), false);
loadInventoryLive().then(function(list) { start(list, true); }).catch(function() { notice(); });
</script>
</body>
</html>
